<svg viewBox="0 0 800 980" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#0096C7"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#E74C3C"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#F39C12"/>
    </marker>
    <marker id="d" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#27AE60"/>
    </marker>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="980" fill="#EFF6FB" rx="14"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="58" rx="14" fill="#0D1B2A"/>
  <rect x="0" y="40" width="800" height="18" fill="#0D1B2A"/>
  <rect x="0" y="55" width="800" height="3" fill="#00B4D8"/>
  <text x="400" y="36" text-anchor="middle" fill="#00B4D8" font-size="18" font-weight="bold">AI Sales Email Agent — Full Agentic Workflow</text>

  <!-- ── COLUMN LABELS ── -->
  <text x="400" y="78" text-anchor="middle" fill="#6B7A8D" font-size="11">n8n orchestrates every step automatically • Claude API handles all AI tasks</text>

  <!-- ════════════════════════════════════════════
       STEP 1 — SCHEDULE TRIGGER
  ════════════════════════════════════════════ -->
  <rect x="270" y="92" width="260" height="54" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="270" y="92" width="6"   height="54" rx="3" fill="#00B4D8"/>
  <text x="292" y="116" fill="#00E5C0" font-size="13" font-weight="bold">⏰  Schedule Trigger</text>
  <text x="292" y="134" fill="#6B7A8D" font-size="11">Every day at 9:00 AM  —  n8n</text>
  <!-- arrow -->
  <line x1="400" y1="146" x2="400" y2="166" stroke="#0096C7" stroke-width="2" marker-end="url(#a)"/>

  <!-- ════════════════════════════════════════════
       STEP 2 — READ LEADS
  ════════════════════════════════════════════ -->
  <rect x="250" y="166" width="300" height="54" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="250" y="166" width="6"   height="54" rx="3" fill="#00B4D8"/>
  <text x="272" y="190" fill="#00E5C0" font-size="13" font-weight="bold">📋  Read Leads — Google Sheets</text>
  <text x="272" y="208" fill="#6B7A8D" font-size="11">Filter rows where Status = pending</text>
  <!-- arrow -->
  <line x1="400" y1="220" x2="400" y2="240" stroke="#0096C7" stroke-width="2" marker-end="url(#a)"/>

  <!-- ════════════════════════════════════════════
       STEP 3 — VALID EMAIL CHECK (diamond)
  ════════════════════════════════════════════ -->
  <polygon points="400,240 490,282 400,324 310,282" fill="#162030" stroke="#00B4D8" stroke-width="1.5" filter="url(#s)"/>
  <text x="400" y="277" text-anchor="middle" fill="#00E5C0" font-size="12" font-weight="bold">Valid Email?</text>
  <text x="400" y="294" text-anchor="middle" fill="#6B7A8D" font-size="10">IF node — n8n</text>

  <!-- NO branch -->
  <line x1="310" y1="282" x2="195" y2="282" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="80"  y="264" width="115" height="36" rx="8" fill="#4A1010" stroke="#E74C3C" stroke-width="1"/>
  <text x="138" y="279" text-anchor="middle" fill="#E74C3C" font-size="11" font-weight="bold">❌ Skip Row</text>
  <text x="138" y="295" text-anchor="middle" fill="#E74C3C" font-size="10">No email found</text>
  <text x="256" y="272" fill="#E74C3C" font-size="10" font-weight="bold">NO</text>

  <!-- YES arrow -->
  <line x1="400" y1="324" x2="400" y2="344" stroke="#0096C7" stroke-width="2" marker-end="url(#a)"/>
  <text x="408" y="337" fill="#27AE60" font-size="10" font-weight="bold">YES</text>

  <!-- ════════════════════════════════════════════
       STEP 4 — CLAUDE WRITES EMAIL
  ════════════════════════════════════════════ -->
  <rect x="220" y="344" width="360" height="62" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="220" y="344" width="6"   height="62" rx="3" fill="#9B59B6"/>
  <text x="242" y="368" fill="#D7BDE2" font-size="13" font-weight="bold">🧠  Claude API — Write Email</text>
  <text x="242" y="385" fill="#6B7A8D" font-size="11">Personalised email using Name, Role, Company</text>
  <text x="242" y="400" fill="#4A90D9" font-size="10">claude-sonnet-4-20250514  ·  Prompt Engineering</text>
  <!-- arrow -->
  <line x1="400" y1="406" x2="400" y2="426" stroke="#0096C7" stroke-width="2" marker-end="url(#a)"/>

  <!-- ════════════════════════════════════════════
       STEP 5 — PARSE EMAIL (Code node)
  ════════════════════════════════════════════ -->
  <rect x="265" y="426" width="270" height="52" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="265" y="426" width="6"   height="52" rx="3" fill="#00B4D8"/>
  <text x="287" y="450" fill="#00E5C0" font-size="13" font-weight="bold">⚙️  Parse Email Content</text>
  <text x="287" y="467" fill="#6B7A8D" font-size="11">Code node — split Subject + Body</text>
  <!-- arrow -->
  <line x1="400" y1="478" x2="400" y2="498" stroke="#0096C7" stroke-width="2" marker-end="url(#a)"/>

  <!-- ════════════════════════════════════════════
       STEP 6 — GMAIL SEND
  ════════════════════════════════════════════ -->
  <rect x="250" y="498" width="300" height="52" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="250" y="498" width="6"   height="52" rx="3" fill="#00B4D8"/>
  <text x="272" y="522" fill="#00E5C0" font-size="13" font-weight="bold">📧  Gmail — Send Email</text>
  <text x="272" y="539" fill="#6B7A8D" font-size="11">Auto-send via Gmail API  ·  OAuth2</text>
  <!-- fork line -->
  <line x1="400" y1="550" x2="400" y2="566" stroke="#0096C7" stroke-width="2"/>
  <line x1="185" y1="566" x2="615" y2="566" stroke="#0096C7" stroke-width="1.5"/>
  <line x1="185" y1="566" x2="185" y2="586" stroke="#0096C7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="615" y1="566" x2="615" y2="586" stroke="#0096C7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ════ PARALLEL LEFT: UPDATE SHEET ════ -->
  <rect x="70"  y="586" width="230" height="52" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="70"  y="586" width="6"   height="52" rx="3" fill="#27AE60"/>
  <text x="92"  y="610" fill="#2ECC71" font-size="12" font-weight="bold">📊  Update Google Sheet</text>
  <text x="92"  y="628" fill="#6B7A8D" font-size="10">Status=sent · save date + subject</text>

  <!-- ════ PARALLEL RIGHT: WAIT FOR REPLY ════ -->
  <rect x="500" y="586" width="230" height="52" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="500" y="586" width="6"   height="52" rx="3" fill="#F39C12"/>
  <text x="522" y="610" fill="#F1C40F" font-size="12" font-weight="bold">📬  Gmail Inbox Watch</text>
  <text x="522" y="628" fill="#6B7A8D" font-size="10">Trigger when reply arrives</text>

  <!-- merge arrows down to classify -->
  <line x1="185" y1="638" x2="185" y2="694" stroke="#0096C7" stroke-width="1.5"/>
  <line x1="615" y1="638" x2="615" y2="694" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="185" y1="694" x2="375" y2="694" stroke="#0096C7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="615" y1="694" x2="428" y2="694" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c)"/>

  <!-- ════════════════════════════════════════════
       STEP 7 — CLASSIFY REPLY
  ════════════════════════════════════════════ -->
  <rect x="215" y="694" width="370" height="62" rx="10" fill="#0D1B2A" filter="url(#s)"/>
  <rect x="215" y="694" width="6"   height="62" rx="3" fill="#9B59B6"/>
  <text x="237" y="718" fill="#D7BDE2" font-size="13" font-weight="bold">🧠  Claude API — Classify Reply</text>
  <text x="237" y="735" fill="#6B7A8D" font-size="11">Interested / Not Interested / Needs Follow-up</text>
  <text x="237" y="750" fill="#4A90D9" font-size="10">claude-sonnet-4-20250514  ·  50 max tokens</text>
  <!-- arrow -->
  <line x1="400" y1="756" x2="400" y2="776" stroke="#0096C7" stroke-width="2" marker-end="url(#a)"/>

  <!-- ════════════════════════════════════════════
       STEP 8 — SWITCH ROUTE (diamond)
  ════════════════════════════════════════════ -->
  <polygon points="400,776 495,820 400,864 305,820" fill="#162030" stroke="#9B59B6" stroke-width="1.5" filter="url(#s)"/>
  <text x="400" y="815" text-anchor="middle" fill="#D7BDE2" font-size="12" font-weight="bold">Switch Route</text>
  <text x="400" y="831" text-anchor="middle" fill="#6B7A8D" font-size="10">n8n Switch node</text>

  <!-- LEFT: Interested -->
  <line x1="305" y1="820" x2="170" y2="820" stroke="#27AE60" stroke-width="1.8" marker-end="url(#d)"/>
  <rect x="50"  y="800" width="120" height="40" rx="8" fill="#0D3B1A" stroke="#27AE60" stroke-width="1"/>
  <text x="110" y="817" text-anchor="middle" fill="#2ECC71" font-size="11" font-weight="bold">✅ Interested</text>
  <text x="110" y="833" text-anchor="middle" fill="#6B7A8D" font-size="10">Notify CRM/Slack</text>
  <text x="248" y="811" fill="#27AE60" font-size="10" font-weight="bold">Interested</text>

  <!-- DOWN: Not Interested -->
  <line x1="400" y1="864" x2="400" y2="900" stroke="#E74C3C" stroke-width="1.8" marker-end="url(#b)"/>
  <rect x="305" y="900" width="190" height="40" rx="8" fill="#3B0D0D" stroke="#E74C3C" stroke-width="1"/>
  <text x="400" y="917" text-anchor="middle" fill="#E74C3C" font-size="11" font-weight="bold">❌ Not Interested</text>
  <text x="400" y="933" text-anchor="middle" fill="#6B7A8D" font-size="10">Mark closed in Notion</text>
  <text x="408" y="880" fill="#E74C3C" font-size="10" font-weight="bold">Not Interested</text>

  <!-- RIGHT: Needs Follow-up -->
  <line x1="495" y1="820" x2="630" y2="820" stroke="#F39C12" stroke-width="1.8" marker-end="url(#c)"/>
  <rect x="630" y="800" width="130" height="40" rx="8" fill="#3B2600" stroke="#F39C12" stroke-width="1"/>
  <text x="695" y="817" text-anchor="middle" fill="#F1C40F" font-size="11" font-weight="bold">🔁 Follow-up</text>
  <text x="695" y="833" text-anchor="middle" fill="#6B7A8D" font-size="10">Schedule next email</text>
  <text x="502" y="811" fill="#F39C12" font-size="10" font-weight="bold">Needs Follow-up</text>

  <!-- Follow-up loops back (curved hint) -->
  <path d="M760 820 Q780 700 760 610 Q740 560 615 560" fill="none" stroke="#F39C12" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="762" y="716" fill="#F39C12" font-size="9" font-style="italic">loops back</text>

  <!-- ════════════════════════════════════════════
       LEGEND
  ════════════════════════════════════════════ -->
  <rect x="18" y="92" width="172" height="128" rx="10" fill="#0D1B2A" opacity="0.90"/>
  <text x="30" y="113" fill="#00B4D8" font-size="12" font-weight="bold">Legend</text>
  <rect x="30" y="120" width="14" height="10" rx="2" fill="#00B4D8"/>
  <text x="50" y="130" fill="#CBD5E0" font-size="10">n8n workflow node</text>
  <rect x="30" y="137" width="14" height="10" rx="2" fill="#9B59B6"/>
  <text x="50" y="147" fill="#CBD5E0" font-size="10">Claude AI node</text>
  <rect x="30" y="154" width="14" height="10" rx="2" fill="#27AE60"/>
  <text x="50" y="164" fill="#CBD5E0" font-size="10">Success / Log</text>
  <rect x="30" y="171" width="14" height="10" rx="2" fill="#F39C12"/>
  <text x="50" y="181" fill="#CBD5E0" font-size="10">Reply handling</text>
  <rect x="30" y="188" width="14" height="10" rx="2" fill="#E74C3C"/>
  <text x="50" y="198" fill="#CBD5E0" font-size="10">Skip / Close</text>

  <!-- Footer -->
  <rect x="0" y="957" width="800" height="23" fill="#0D1B2A"/>
  <text x="400" y="973" text-anchor="middle" fill="#6B7A8D" font-size="10">AI Sales Email Agent  ·  n8n + Claude API + Gmail API + Power BI  ·  Portfolio 2025</text>
</svg>
